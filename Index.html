<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sports Day Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #f7f5f2; --panel: #ffffff; --text: #1f2430; --text-dim: #6b7280;
    --border: #e5e0d8; --accent: #c1531b; --accent-soft: #f3e2d3;
    --win: #2f7a4f; --win-soft: #e3f2e8; --danger: #b23b3b;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181c; --panel: #202226; --text: #ecebe8; --text-dim: #9a9ea5;
      --border: #34363c; --accent: #e08a4f; --accent-soft: #3a2c22;
      --win: #6cc296; --win-soft: #1f3327; --danger: #e07a7a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181c; --panel: #202226; --text: #ecebe8; --text-dim: #9a9ea5;
    --border: #34363c; --accent: #e08a4f; --accent-soft: #3a2c22;
    --win: #6cc296; --win-soft: #1f3327; --danger: #e07a7a;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { padding: 20px 20px 8px; max-width: 980px; margin: 0 auto; }
  header h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--text-dim); font-size: 14px; }
  .sync-note { max-width: 980px; margin: 10px auto 0; padding: 8px 14px; border-radius: 10px; font-size: 12.5px; background: var(--accent-soft); color: var(--text); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 16px; -webkit-overflow-scrolling: touch; }
  .tab-btn { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--text); border: 1px solid var(--border); }
  .chip.out { opacity: 0.5; text-decoration: line-through; }
  .add-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-row input { flex: 1; }
  form.match-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  form.match-form .full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  select, input[type=text] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
  button { cursor: pointer; border: none; border-radius: 8px; font-size: 13px; padding: 9px 14px; font-weight: 600; }
  .btn-primary { background: var(--accent); color: #fff; grid-column: 1 / -1; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-wrap { overflow-x: auto; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-dim); font-weight: 600; font-size: 12px; }
  .winner-cell { color: var(--win); font-weight: 600; }
  .rank { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 10px 0; }
  .msg { font-size: 12.5px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; display: none; }
  .msg.show { display: block; }
  .msg.error { background: #fdeceb; color: var(--danger); }
  .msg.ok { background: var(--win-soft); color: var(--win); }
  .top-actions { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 6px; flex-wrap: wrap; }
  .top-actions button { font-size: 12px; padding: 6px 10px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { form.match-form, .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🏓 Sports Day Results Tracker</h1>
  <p>Add players and log results — everything saves straight into the shared sheets.</p>
</header>
<div class="sync-note" id="syncNote">Loading current data…</div>
<div class="wrap">
  <div class="top-actions">
    <button class="btn-ghost" id="refreshBtn">Refresh now</button>
    <button class="btn-ghost" id="exportBtn">Export CSV</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="content">Loading…</div>
</div>

<script>
(function(){
  // ---------------- Config ----------------
  var PLAYER_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSedj7YodKx_FCTLbrMYamoe4-eFwqCd9PJ-Kb0mTZ6tSAVTMg/formResponse";
  var PLAYER_ENTRIES = { name: "entry.1266189178", age: "entry.126705541", sex: "entry.283463913", sport: "entry.1323722484" };
  var PLAYER_SHEET_ID = "1pqqMQHDUI77oXSC-GushpgC7QRKWYaoadYSJnkV5Eqw";

  var RESULT_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSei8hwCN-HG8st12jL2EJWCaL2UfkomKz7aP4njpGYqUARIPQ/formResponse";
  var RESULT_ENTRIES = { sport: "entry.920370904", winner: "entry.1059288878", round: "entry.2039988208", runnerup: "entry.1391858425", score: "entry.1871540125" };
  var RESULT_SHEET_ID = "1A8t1hILlwI_KwWdwg0tMj6OGdmN1C4FpF6zmMWJPQfA";

  var SHEET_TAB_NAME = "Form Responses 1";
  var REFRESH_MS = 25000;

  var SPORTS = [
    { id: "table-tennis",   label: "Table Tennis",    addValue: "table tennis",         resultValue: "Table Tennis" },
    { id: "pool-singles",   label: "Pool Singles",    addValue: "pool table singles",   resultValue: "Pool singles" },
    { id: "pool-doubles",   label: "Pool Doubles",    addValue: "pool table doubles",   resultValue: "Pool doubles" },
    { id: "carrom-singles", label: "Carrom Singles",  addValue: "carrom singles",       resultValue: "Carrom Singles" },
    { id: "carrom-doubles", label: "Carrom Doubles",  addValue: "carrom doubles",       resultValue: "Carrom Doubles" },
    { id: "chess",          label: "Chess",           addValue: "chess",                resultValue: "Chess" },
  ];

  var activeSport = SPORTS[0].id;
  var players = {};
  var matches = {};
  SPORTS.forEach(function(s){ players[s.id] = []; matches[s.id] = []; });
  var lastSync = null;

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
  }
  function norm(s){ return String(s||"").trim().toLowerCase(); }

  function fetchGviz(sheetId, cb){
    var cbName = "gvizCb_" + Math.random().toString(36).slice(2);
    var timeout = setTimeout(function(){
      if (window[cbName]) { window[cbName] = function(){}; cb(null); }
    }, 12000);
    window[cbName] = function(resp){
      clearTimeout(timeout);
      cb(resp);
      delete window[cbName];
    };
    var url = "https://docs.google.com/spreadsheets/d/" + sheetId + "/gviz/tq?tqx=out:json;responseHandler:" + cbName +
              "&sheet=" + encodeURIComponent(SHEET_TAB_NAME) + "&_ts=" + Date.now();
    var script = document.createElement("script");
    script.src = url;
    script.onerror = function(){ clearTimeout(timeout); cb(null); delete window[cbName]; script.remove(); };
    document.body.appendChild(script);
    setTimeout(function(){ if (script.parentNode) script.remove(); }, 13000);
  }

  function rowsFromResponse(resp){
    if (!resp || !resp.table) return [];
    var labels = (resp.table.cols || []).map(function(c){ return (c.label || "").trim(); });
    return (resp.table.rows || []).map(function(r){
      var obj = {};
      (r.c || []).forEach(function(cell, i){
        var val = "";
        if (cell) { val = (cell.f !== undefined && cell.f !== null) ? cell.f : (cell.v !== undefined && cell.v !== null ? cell.v : ""); }
        obj[labels[i]] = val;
      });
      return obj;
    });
  }

  function loadAll(cb){
    var done = 0;
    var playerRows = null, resultRows = null;
    function maybeDone(){
      done++;
      if (done === 2) {
        applyData(playerRows || [], resultRows || []);
        cb && cb();
      }
    }
    fetchGviz(PLAYER_SHEET_ID, function(resp){ playerRows = rowsFromResponse(resp); maybeDone(); });
    fetchGviz(RESULT_SHEET_ID, function(resp){ resultRows = rowsFromResponse(resp); maybeDone(); });
  }

  function applyData(playerRows, resultRows){
    SPORTS.forEach(function(s){ players[s.id] = []; matches[s.id] = []; });

    playerRows.forEach(function(row){
      var name = (row["Player Name"] || "").toString().trim();
      var sportVal = norm(row["Name of the game"]);
      if (!name) return;
      var sport = SPORTS.filter(function(s){ return norm(s.addValue) === sportVal; })[0];
      if (!sport) return;
      if (!players[sport.id].some(function(p){ return norm(p) === norm(name); })) {
        players[sport.id].push(name);
      }
    });

    resultRows.forEach(function(row){
      var sportVal = norm(row["Select Sport"]);
      var sport = SPORTS.filter(function(s){ return norm(s.resultValue) === sportVal; })[0];
      if (!sport) return;
      var winner = (row["Winning Team or Player Name"] || "").toString().trim();
      var runnerup = (row["Runner-up Team or Player Name"] || "").toString().trim();
      var round = (row["Round"] || "").toString().trim();
      var score = (row["Final Score or Match Details"] || "").toString().trim();
      var ts = (row["Timestamp"] || "").toString().trim();
      if (!winner && !runnerup) return;
      matches[sport.id].push({ winner: winner, runnerup: runnerup, round: round, score: score, ts: ts });
    });

    lastSync = new Date();
  }

  function submitPlayer(sportId, name, done){
    var sport = SPORTS.filter(function(s){ return s.id === sportId; })[0];
    var body = new URLSearchParams();
    body.append(PLAYER_ENTRIES.name, name);
    body.append(PLAYER_ENTRIES.age, "");
    body.append(PLAYER_ENTRIES.sex, "");
    body.append(PLAYER_ENTRIES.sport, sport.addValue);
    fetch(PLAYER_FORM_URL, { method: "POST", mode: "no-cors", body: body })
      .then(function(){ done(true); }).catch(function(){ done(false); });
  }

  function submitMatch(sportId, winner, runnerup, round, score, done){
    var sport = SPORTS.filter(function(s){ return s.id === sportId; })[0];
    var body = new URLSearchParams();
    body.append(RESULT_ENTRIES.sport, sport.resultValue);
    body.append(RESULT_ENTRIES.winner, winner);
    body.append(RESULT_ENTRIES.round, round);
    body.append(RESULT_ENTRIES.runnerup, runnerup);
    body.append(RESULT_ENTRIES.score, score);
    fetch(RESULT_FORM_URL, { method: "POST", mode: "no-cors", body: body })
      .then(function(){ done(true); }).catch(function(){ done(false); });
  }

  function computeSportState(sportId){
    var roster = players[sportId].slice();
    var ms = matches[sportId];

    var eliminated = {};
    var playedPairs = {};
    var maxRound = 0;
    ms.forEach(function(m){
      if (m.runnerup) eliminated[norm(m.runnerup)] = true;
      var rNum = parseInt(m.round, 10);
      if (!isNaN(rNum) && rNum > maxRound) maxRound = rNum;
      var pair = [norm(m.winner), norm(m.runnerup)].sort().join("~~");
      playedPairs[m.round + "::" + pair] = true;
    });

    var active = roster.filter(function(p){ return !eliminated[norm(p)]; });
    var eliminatedList = roster.filter(function(p){ return eliminated[norm(p)]; });
    var suggestedRound = maxRound > 0 ? maxRound + 1 : 1;

    return { roster: roster, active: active, eliminatedList: eliminatedList, playedPairs: playedPairs, suggestedRound: suggestedRound };
  }

  function computeStandings(sportId){
    var wins = {}, played = {};
    players[sportId].forEach(function(p){ wins[p] = 0; played[p] = 0; });
    matches[sportId].forEach(function(m){
      if (m.winner) { if (!(m.winner in played)) played[m.winner] = 0; if (!(m.winner in wins)) wins[m.winner] = 0; played[m.winner]++; wins[m.winner]++; }
      if (m.runnerup) { if (!(m.runnerup in played)) played[m.runnerup] = 0; played[m.runnerup]++; }
    });
    return Object.keys(played).map(function(name){ return { name: name, wins: wins[name]||0, played: played[name]||0 }; })
      .sort(function(a,b){ return b.wins - a.wins || b.played - a.played; });
  }

  function renderTabs(){
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    SPORTS.forEach(function(s){
      var btn = document.createElement("button");
      btn.className = "tab-btn" + (s.id === activeSport ? " active" : "");
      btn.textContent = s.label;
      btn.onclick = function(){ activeSport = s.id; render(); };
      tabs.appendChild(btn);
    });
  }

  function showMsg(el, text, isError){
    el.textContent = text;
    el.className = "msg show " + (isError ? "error" : "ok");
    setTimeout(function(){ el.className = "msg"; }, 4000);
  }

  function playerOptions(list){
    return list.map(function(p){ return '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + "</option>"; }).join("");
  }

  function render(){
    renderTabs();
    var sport = SPORTS.filter(function(s){ return s.id === activeSport; })[0];
    var state = computeSportState(sport.id);
    var standings = computeStandings(sport.id);
    var ms = matches[sport.id].slice().reverse();

    document.getElementById("syncNote").textContent = lastSync
      ? "Synced with the shared sheets — last updated " + lastSync.toLocaleTimeString()
      : "Loading current data…";

    var content = document.getElementById("content");
    content.innerHTML =
      '<div class="card">' +
        "<h2>" + escapeHtml(sport.label) + "</h2>" +
        '<div class="sub">' + state.roster.length + " registered · " + state.active.length + " still in it" +
          (state.eliminatedList.length ? " · " + state.eliminatedList.length + " eliminated" : "") + "</div>" +
        '<div class="chip-row">' +
          state.roster.map(function(p){
            var out = state.eliminatedList.indexOf(p) !== -1;
            return '<span class="chip' + (out ? " out" : "") + '">' + escapeHtml(p) + "</span>";
          }).join("") +
        "</div>" +
        '<div class="add-row">' +
          '<input type="text" id="newPlayerInput" placeholder="Add a late entry (name)" />' +
          '<button class="btn-ghost" id="addPlayerBtn">Add player</button>' +
        "</div>" +
        '<div class="msg" id="playerMsg"></div>' +
      "</div>" +

      '<div class="card">' +
        "<h2>Log a result</h2>" +
        '<div class="sub">Suggested round: ' + state.suggestedRound + ". Dropdowns only show players still in the running." + "</div>" +
        '<form class="match-form" id="matchForm">' +
          "<div><label>Winner</label><select id=\"winnerSel\">" + playerOptions(state.active) + "</select></div>" +
          "<div><label>Runner-up / Opponent</label><select id=\"runnerupSel\"><option value=\"\">— none —</option>" + playerOptions(state.active) + "</select></div>" +
          '<div><label>Round</label><input type="text" id="roundInput" value="' + escapeHtml(String(state.suggestedRound)) + '" /></div>' +
          '<div><label>Score / Note</label><input type="text" id="scoreInput" placeholder="e.g. 11-6, 11-9" /></div>' +
          '<button type="submit" class="btn-primary full">Submit result</button>' +
        "</form>" +
        '<div class="msg" id="matchMsg"></div>' +
      "</div>" +

      '<div class="two-col">' +
        '<div class="card">' +
          "<h2>Standings</h2>" +
          (standings.filter(function(r){return r.played>0;}).length === 0
            ? '<div class="empty">No results logged yet.</div>'
            : '<div class="table-wrap"><table><thead><tr><th>#</th><th>Player</th><th>Wins</th><th>Played</th></tr></thead><tbody>' +
                standings.filter(function(r){return r.played>0;}).map(function(r,i){
                  return "<tr><td><span class=\"rank\">" + (i+1) + "</span></td><td>" + escapeHtml(r.name) + "</td><td>" + r.wins + "</td><td>" + r.played + "</td></tr>";
                }).join("") +
              "</tbody></table></div>") +
        "</div>" +
        '<div class="card">' +
          "<h2>Match history</h2>" +
          (ms.length === 0
            ? '<div class="empty">No matches recorded yet.</div>'
            : '<div class="table-wrap"><table><thead><tr><th>Rd</th><th>Winner</th><th>vs</th><th>Score</th></tr></thead><tbody>' +
                ms.map(function(m){
                  return "<tr><td>" + escapeHtml(m.round||"—") + "</td><td class=\"winner-cell\">" + escapeHtml(m.winner||"—") +
                         "</td><td>" + escapeHtml(m.runnerup||"—") + "</td><td>" + escapeHtml(m.score||"—") + "</td></tr>";
                }).join("") +
              "</tbody></table></div>") +
        "</div>" +
      "</div>";

    document.getElementById("addPlayerBtn").addEventListener("click", function(){
      var input = document.getElementById("newPlayerInput");
      var name = input.value.trim();
      var msgEl = document.getElementById("playerMsg");
      if (!name) return;
      if (state.roster.some(function(p){ return norm(p) === norm(name); })) {
        showMsg(msgEl, "That name is already registered for " + sport.label + ".", true);
        return;
      }
      submitPlayer(sport.id, name, function(ok){
        if (ok) {
          showMsg(msgEl, "Added. It'll appear here within a few seconds.", false);
          input.value = "";
          setTimeout(function(){ loadAll(render); }, 1500);
        } else {
          showMsg(msgEl, "Couldn't submit — check your connection and try again.", true);
        }
      });
    });

    document.getElementById("matchForm").addEventListener("submit", function(e){
      e.preventDefault();
      var winner = document.getElementById("winnerSel").value;
      var runnerup = document.getElementById("runnerupSel").value;
      var round = document.getElementById("roundInput").value.trim();
      var score = document.getElementById("scoreInput").value.trim();
      var msgEl = document.getElementById("matchMsg");
      if (!winner) return;
      if (winner && runnerup && norm(winner) === norm(runnerup)) {
        showMsg(msgEl, "Winner and runner-up can't be the same player.", true);
        return;
      }
      if (runnerup) {
        var pairKey = round + "::" + [norm(winner), norm(runnerup)].sort().join("~~");
        if (state.playedPairs[pairKey]) {
          showMsg(msgEl, "This match is already recorded for round " + round + ".", true);
          return;
        }
      }
      submitMatch(sport.id, winner, runnerup, round, score, function(ok){
        if (ok) {
          showMsg(msgEl, "Result submitted — refreshing shortly.", false);
          setTimeout(function(){ loadAll(render); }, 1500);
        } else {
          showMsg(msgEl, "Couldn't submit — check your connection and try again.", true);
        }
      });
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", function(){ loadAll(render); });

  document.getElementById("exportBtn").addEventListener("click", function(){
    var rows = [["Sport","Winner","Runner-up/Opponent","Round","Score"]];
    SPORTS.forEach(function(sport){
      matches[sport.id].forEach(function(m){
        rows.push([sport.label, m.winner||"", m.runnerup||"", m.round||"", m.score||""]);
      });
    });
    var csv = rows.map(function(r){ return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(","); }).join("\n");
    var blob = new Blob([csv], { type: "text/csv" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "sports_day_results.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  loadAll(function(){
    render();
    setInterval(function(){ loadAll(render); }, REFRESH_MS);
  });
  render();
})();
</script>
</body>
</html>
